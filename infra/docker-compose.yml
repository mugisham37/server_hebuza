# Local dev stack for api + worker. `pnpm infra:up`. Prod uses managed equivalents (BUILD-PLAN §1).
name: hebuza-stack # distinct from the legacy "hebuza" compose project, whose data stays untouched
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: hebuza, POSTGRES_PASSWORD: hebuza, POSTGRES_DB: hebuza }
    ports: ["5442:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hebuza"], interval: 5s, retries: 10 }
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    environment: { DATABASE_URL: "postgres://hebuza:hebuza@postgres:5432/hebuza", POOL_MODE: transaction, AUTH_TYPE: scram-sha-256, MAX_CLIENT_CONN: 1000, DEFAULT_POOL_SIZE: 25 }
    ports: ["6442:5432"]
    depends_on: [postgres]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6390:6379"]
    volumes: [redis:/data]
  minio:
    image: minio/minio:latest # shortcut: Docker Hub minio/minio release tags are not pullable here; pin a digest from your registry before prod
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: hebuza, MINIO_ROOT_PASSWORD: hebuza-dev-secret }
    ports: ["9010:9000", "9011:9001"]
    volumes: [minio:/data]
  clamav:
    image: clamav/clamav:1.4
    ports: ["3320:3310"]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1035:1025", "8035:8025"]
volumes: { pg: {}, redis: {}, minio: {} }
