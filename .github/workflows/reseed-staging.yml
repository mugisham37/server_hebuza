# Manual: purge demo data from STAGING and seed it again (Phase 2 ops). Never targets production.
# Secret: RAILWAY_TOKEN_STAGING (project token scoped to staging). The runner reaches Postgres through Railway's public
# proxy, so the hebuza-api service must expose DATABASE_PUBLIC_URL (Railway Postgres reference variable).
name: reseed-staging
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Commit the purge (unchecked = dry run that only lists what would be deleted)
      seed:
        type: boolean
        default: true
        description: Seed demo data after an applied purge
concurrency:
  group: reseed-staging
  cancel-in-progress: false
jobs:
  reseed:
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm i -g @railway/cli
      - name: Purge demo data
        run: |
          railway run --service hebuza-api --environment staging -- sh -c \
            'DATABASE_URL="$DATABASE_PUBLIC_URL" pnpm db:purge-demo ${{ inputs.apply && '--apply' || '' }}'
      - name: Migrate + seed
        if: ${{ inputs.apply && inputs.seed }}
        run: |
          railway run --service hebuza-api --environment staging -- sh -c \
            'export DATABASE_URL="$DATABASE_PUBLIC_URL" ALLOW_SEED=staging RAILWAY_ENVIRONMENT_NAME=staging; pnpm db:migrate && pnpm db:seed'
