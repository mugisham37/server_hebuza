name: server
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code openapi.json # contract regenerated by build must be committed

  # Every route × every seeded persona against a real api (Postgres+pgvector, Redis). S3/mail are not touched by the matrix.
  authz:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: hebuza, POSTGRES_PASSWORD: hebuza, POSTGRES_DB: hebuza }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hebuza" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://hebuza:hebuza@localhost:5432/hebuza
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ci
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
      MAIL_FROM: ci@example.test
      PAYMENTS_STUB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Throwaway keys
        run: |
          openssl genpkey -algorithm ed25519 -out k.pem && openssl pkey -in k.pem -pubout -out k.pub
          { echo "FIELD_KEY=$(openssl rand -base64 32)"; echo "BLIND_INDEX_KEY=$(openssl rand -base64 32)"
            echo "JWT_PRIVATE_KEY<<EOF"; cat k.pem; echo EOF; echo "JWT_PUBLIC_KEY<<EOF"; cat k.pub; echo EOF; } >> "$GITHUB_ENV"
      - run: pnpm build && pnpm db:migrate && pnpm db:seed
      - run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:4000/health && exit 0; sleep 1; done; cat api.log; exit 1
      - run: npx tsx test/authz/matrix.ts
      - if: failure()
        run: tail -200 api.log
